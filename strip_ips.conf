# FPGA IP Strip Config
# Format: <hier_module> : <inst1> <inst2> ...
# Format: tie1 <module_name> : <port1> <port2> ...
# Lines starting with # are comments
#
# tie1 lines: when stripping instances of <module_name>, the listed output
# ports are tied to 1'b1 instead of 'b0.  Use this for signals that must
# be driven high (e.g. status/ready indicators) to avoid downstream hangs.

run_int: eftu_mce_wrap spi1 spi2 can0 can10 cpu1_tcm_wrap eftu*
run_int: sram_decoder rtu1_cache_wrap
run_int: u_u65

run_top: mct

# mct module: ifr_load_done and bisr_reset need to be tied high
tie1 mct : ifr_load_done bisr_reset
